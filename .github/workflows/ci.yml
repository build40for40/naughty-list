name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Check backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
  manifest:
    name: Validate extension manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest
        run: |
          jq -e '
            .manifest_version == 3 and
            (.name | type == "string" and length > 0 and length <= 75) and
            (.version | type == "string" and test("^[0-9]{1,5}([.][0-9]{1,5}){0,3}$"))
          ' extension/manifest.json
