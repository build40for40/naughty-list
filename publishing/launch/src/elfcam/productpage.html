<!doctype html><html><head><meta charset="utf-8">
<!-- Render harness: a plain H&M-style product page running the real launch stamp
     (extension/shared.js + content.js from the ref passed to render-elfcam.sh) with stubbed extension APIs.
     The assessment is the live API response for www2.hm.com (hm-assessment.json, fetched 4 Nov 2026). -->
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"Christmas jumper","offers":{"@type":"Offer","price":"24.99","priceCurrency":"GBP"}}</script>
<style>
body{margin:0;background:#fff;color:#222;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.bar{height:64px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;padding:0 32px;gap:28px;font-size:14px;color:#444}
.bar b{font-size:24px;color:#111;margin-right:18px;letter-spacing:-.02em}
.page{display:grid;grid-template-columns:420px 380px;gap:40px;padding:36px 32px}
.img{height:560px;background:linear-gradient(160deg,#b8322c,#7c1d1a);display:flex;align-items:flex-end;padding:18px;color:#fff;font-size:13px}
.crumb{font-size:12px;color:#777;margin-bottom:10px}
h2{font-weight:500;font-size:24px;margin:0 0 8px}
.price{font-size:20px;margin:6px 0 22px}
.sz{display:flex;gap:8px;margin-bottom:22px}.sz span{width:48px;height:40px;border:1px solid #ccc;display:grid;place-items:center;font-size:13px}
.add{width:300px;height:50px;background:#222;color:#fff;border:0;font-size:14px}
.desc{margin-top:26px;font-size:13px;color:#666;line-height:1.6;max-width:360px}
.label{position:fixed;left:84px;bottom:24px;font:700 11px -apple-system,sans-serif;color:#fff;background:rgba(0,0,0,.5);padding:4px 9px;border-radius:5px;letter-spacing:.04em}
</style></head><body>

<div class="bar"><b>H&amp;M</b> Women · Men · Kids · Home · Christmas gifts</div>
<div class="page">
  <div class="img">Product photo</div>

<script>
const mode=new URLSearchParams(location.search).get('mode')||'intro';
const today=new Date().toDateString();
window.chrome={runtime:{getURL:p=>'/ext/'+p,sendMessage:async m=>m.type==='assess-domain'?{assessment:await (await fetch('/hm-assessment.json')).json()}:{}},
  storage:{local:{get:async k=>(typeof k==='string'&&k.startsWith('elfCamIntro:')&&mode!=='intro')?{[k]:today}:{},set:async()=>{}},onChanged:{addListener(){}}}};
</script>
<script src="/ext/shared.js"></script>

<script>
if(mode==='file') setTimeout(()=>{const d=document.getElementById('naughty-list-stamp')?.shadowRoot?.querySelector('details');if(d)d.open=true},1600);
</script>
