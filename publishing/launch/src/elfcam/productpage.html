<!doctype html><html><head><meta charset="utf-8">
<!-- Render harness: a plain H&M-style product page running the real launch stamp
     (extension/shared.js + content.js from the ref passed to render-elfcam.sh) with stubbed extension APIs.
     The assessment is the live API response for the page hostname; ?shop=patagonia uses patagonia-assessment-nice.json (live response + the draft v0.3 verdict from card 159). -->
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"Product","offers":{"@type":"Offer","price":"24.99","priceCurrency":"GBP"}}</script>
<style>
body{margin:0;background:#fff;color:#222;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.bar{height:64px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;padding:0 32px;gap:28px;font-size:14px;color:#444}
.bar b{font-size:24px;color:#111;margin-right:18px;letter-spacing:-.02em}
.page{display:grid;grid-template-columns:420px 380px;gap:40px;padding:36px 32px}
.img{height:560px;background:linear-gradient(160deg,#b8322c,#7c1d1a);display:flex;align-items:flex-end;padding:18px;color:#fff;font-size:13px}
.crumb{font-size:12px;color:#777;margin-bottom:10px}
h2{font-weight:500;font-size:24px;margin:0 0 8px}
.price{font-size:20px;margin:6px 0 22px}
.sz{display:flex;gap:8px;margin-bottom:22px}.sz span{width:48px;height:40px;border:1px solid #ccc;display:grid;place-items:center;font-size:13px}
.add{width:300px;height:50px;background:#222;color:#fff;border:0;font-size:14px}
.desc{margin-top:26px;font-size:13px;color:#666;line-height:1.6;max-width:360px}
.label{position:fixed;left:84px;bottom:24px;font:700 11px -apple-system,sans-serif;color:#fff;background:rgba(0,0,0,.5);padding:4px 9px;border-radius:5px;letter-spacing:.04em}
</style></head><body>
<div class="label">REAL LAUNCH STAMP + LIVE H&amp;M API RESULT ON A MOCK PAGE · RECAPTURE ON WWW2.HM.COM BEFORE UPLOAD</div>
<div class="bar"><b>H&amp;M</b> Women · Men · Kids · Home · Christmas gifts</div>
<div class="page">
  <div class="img">Product photo</div>
  <div><div class="crumb">Men › Jumpers › Christmas</div><h2>Christmas jumper</h2><div class="price" itemprop="price" content="24.99">£24.99</div>
  <div class="sz"><span>S</span><span>M</span><span>L</span><span>XL</span></div><button class="add">Add to bag</button>
  <div class="desc">[Product description]</div></div>
</div>
<script>
const q=new URLSearchParams(location.search), mode=q.get('mode')||'intro', shop=q.get('shop')||'hm';
const SHOPS={hm:{brand:'H&amp;M',nav:'Women · Men · Kids · Home · Christmas gifts',crumb:'Men › Jumpers › Christmas',name:'Christmas jumper',price:'£24.99',img:'linear-gradient(160deg,#b8322c,#7c1d1a)',file:'/hm-assessment.json',label:'REAL LAUNCH STAMP + LIVE H&amp;M API RESULT ON A MOCK PAGE · RECAPTURE ON WWW2.HM.COM BEFORE UPLOAD'},
 patagonia:{brand:'patagonia',nav:'Women · Men · Kids · Packs &amp; Gear · Gifts',crumb:'Men › Fleece › Gifts',name:'Retro Pile Fleece Jacket',price:'£150.00',img:'linear-gradient(160deg,#3d6b5a,#1e3a30)',file:'/patagonia-assessment-nice.json',label:'REAL LAUNCH STAMP · LIVE PATAGONIA RESULT + DRAFT v0.3 VERDICT · MOCK PAGE'}};
const S=SHOPS[shop];
addEventListener('DOMContentLoaded',()=>{document.querySelector('.bar').innerHTML='<b>'+S.brand+'</b> '+S.nav;document.querySelector('.crumb').innerHTML=S.crumb;document.querySelector('h2').textContent=S.name;document.querySelector('.price').textContent=S.price;document.querySelector('.img').style.background=S.img;document.querySelector('.label').innerHTML=S.label;});
const today=new Date().toDateString();
window.chrome={runtime:{getURL:p=>'/ext/'+p,sendMessage:async m=>m.type==='assess-domain'?{assessment:await (await fetch(S.file)).json()}:{}},
  storage:{local:{get:async k=>(typeof k==='string'&&k.startsWith('elfCamIntro:')&&mode!=='intro')?{[k]:today}:{},set:async()=>{}},onChanged:{addListener(){}}}};
</script>
<script src="/ext/shared.js"></script>
<script src="/ext/content.render.js"></script>
<script>
if(mode==='file') setTimeout(()=>{const d=document.getElementById('naughty-list-stamp')?.shadowRoot?.querySelector('details');if(d)d.open=true},1600);
</script>
</body></html>
