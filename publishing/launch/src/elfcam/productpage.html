<!doctype html><html><head><meta charset="utf-8">
<!-- Render harness: a plain H&M-style product page that runs Lawrence's real Elf Cam files
     (extension/verdict.js + content.js from the ref passed to render-elfcam.sh) with stubbed extension APIs.
     The assessment fed in is Ben's assess() output for H&M (hm-registry) plus storeType single_brand. -->
<style>
body{margin:0;background:#fff;color:#222;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.bar{height:64px;border-bottom:1px solid #e8e8e8;display:flex;align-items:center;padding:0 32px;gap:28px;font-size:14px;color:#444}
.bar b{font-size:24px;color:#111;margin-right:18px;letter-spacing:-.02em}
.page{display:grid;grid-template-columns:420px 380px;gap:40px;padding:36px 32px}
.img{height:560px;background:linear-gradient(160deg,#b8322c,#7c1d1a);display:flex;align-items:flex-end;padding:18px;color:#fff;font-size:13px}
.crumb{font-size:12px;color:#777;margin-bottom:10px}
h2{font-weight:500;font-size:24px;margin:0 0 8px}
.price{font-size:20px;margin:6px 0 22px}
.sz{display:flex;gap:8px;margin-bottom:22px}.sz span{width:48px;height:40px;border:1px solid #ccc;display:grid;place-items:center;font-size:13px}
.add{width:300px;height:50px;background:#222;color:#fff;display:grid;place-items:center;font-size:14px}
.desc{margin-top:26px;font-size:13px;color:#666;line-height:1.6;max-width:360px}
</style></head><body>
<div style="position:fixed;left:84px;bottom:24px;z-index:1;font:700 11px -apple-system,sans-serif;color:#fff;background:rgba(0,0,0,.5);padding:4px 9px;border-radius:5px;letter-spacing:.04em">REAL ELF CAM UI ON A MOCK PAGE · RECAPTURE ON WWW2.HM.COM BEFORE UPLOAD</div>
<div class="bar"><b>H&amp;M</b> Women · Men · Kids · Home · Christmas gifts</div>
<div class="page">
  <div class="img">Product photo</div>
  <div><div class="crumb">Men › Jumpers › Christmas</div><h2>Christmas jumper</h2><div class="price">£[price]</div>
  <div class="sz"><span>S</span><span>M</span><span>L</span><span>XL</span></div><div class="add">Add to bag</div>
  <div class="desc">[Product description]</div></div>
</div>
<script>
const q=new URLSearchParams(location.search), mode=q.get('mode')||'intro';
const HM={schemaVersion:'1',input:{domain:location.hostname},
  match:{status:'matched',method:'reviewed_domain',domain:location.hostname,storeType:'single_brand',evidence:{sourceUrl:'https://hmgroup.com/brands/',checkedAt:'2026-11-04'}},
  company:{id:'hm',name:'H&M',identifiers:[]},
  criteria:{bCorp:{status:'verified',certified:false,reason:null,source:{name:'B Lab',url:'https://www.bcorporation.net/en-us/find-a-b-corp/?query=H%26M'},checkedAt:'2026-11-04',validUntil:'2026-12-04'}},
  scoring:{status:'deferred',total:null,verdict:null}};
window.chrome={runtime:{lastError:null,getURL:p=>'/ext/'+p,sendMessage:(m,cb)=>setTimeout(()=>cb({ok:true,data:HM}),10)},
  storage:{local:{get:async k=>mode==='intro'?{}:{[k]:(d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`)(new Date())},set:async()=>{}}}};
</script>
<script src="/ext/verdict.js"></script>
<script src="/ext/content.render.js"></script>
<script>
if(mode==='file') setTimeout(()=>{const h=document.querySelector('naughty-list-elf-cam');h&&h.shadowRoot.querySelector('.badge').click()},600);
</script>
</body></html>
