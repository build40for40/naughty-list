<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 96px artwork centred with 16px transparent padding (Chrome store rule) -->
  <rect x="16" y="16" width="96" height="96" rx="22" fill="#002D69"/>
  <!-- Santa's list: a cream sheet with three lines -->
  <rect x="36" y="28" width="46" height="62" rx="6" fill="#F2F0EA"/>
  <rect x="44" y="40" width="30" height="6" rx="3" fill="#9AA6C4"/>
  <rect x="44" y="53" width="30" height="6" rx="3" fill="#9AA6C4"/>
  <rect x="44" y="66" width="18" height="6" rx="3" fill="#9AA6C4"/>
  <!-- the check: lime badge with a navy tick -->
  <circle cx="82" cy="84" r="18" fill="#A6E22E" stroke="#002D69" stroke-width="5"/>
  <path d="M73.5 84.5l6 6 11-12" fill="none" stroke="#002D69" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a yellow star, the festive nod -->
  <path d="M33 23l2.6 5.4 5.9.8-4.3 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z" fill="#FFD400"/>
